<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ticker Pi 5</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="panel">
    <p class="eyebrow">128 × 32 LED TICKER</p>
    <h1>Ticker Pi 5</h1>
    <p id="status" class="status">Current mode: <strong>{{ current_mode }}</strong></p>
    <section class="mode-grid" aria-label="Display mode">
      {% for mode in modes %}
      <button class="mode-button mode-{{ mode }} {% if mode == current_mode %}active{% endif %}" data-mode="{{ mode }}">
        {{ mode }}
      </button>
      {% endfor %}
    </section>
    <section class="brightness">
      <label for="brightness">Brightness <output id="brightness-value">{{ brightness }}%</output></label>
      <input id="brightness" type="range" min="5" max="100" value="{{ brightness }}" aria-label="Brightness">
      <p id="schedule" class="schedule">{{ schedule_note }}</p>
    </section>
    <section class="flight">
      <label for="flight-input">Flight to track</label>
      <form id="flight-form" class="flight-row">
        <input id="flight-input" name="flight" type="text" value="{{ flight }}"
               placeholder="UA889" autocapitalize="characters" autocomplete="off"
               spellcheck="false" maxlength="12" aria-label="Flight number">
        <button type="submit" class="flight-go">Track</button>
      </form>
      <p id="flight-note" class="schedule">Airline flight number, e.g. UA889 or DL38.</p>
    </section>
    <section class="flight">
      <label for="station-select">BART station</label>
      <form id="station-form" class="flight-row">
        <select id="station-select" name="station" aria-label="BART station">
          {% for abbr, name in stations %}
          <option value="{{ abbr }}" {% if abbr == station %}selected{% endif %}>{{ name }}</option>
          {% endfor %}
        </select>
        <button type="submit" class="flight-go">Show</button>
      </form>
      <p id="station-note" class="schedule">Next three trains, soonest first.</p>
    </section>
    <p id="renderer" class="renderer">Checking renderer…</p>
  </main>
  <script>
    /* MIT License — Copyright (c) 2026 John Kuok */
    const status = document.getElementById('status');
    const renderer = document.getElementById('renderer');
    const slider = document.getElementById('brightness');
    const brightnessValue = document.getElementById('brightness-value');
    const schedule = document.getElementById('schedule');
    const flightForm = document.getElementById('flight-form');
    const flightInput = document.getElementById('flight-input');
    const flightNote = document.getElementById('flight-note');
    const stationForm = document.getElementById('station-form');
    const stationSelect = document.getElementById('station-select');
    const stationNote = document.getElementById('station-note');
    /* As with the flight field: a poll must not reset a station the user has
       chosen from the list but not yet submitted. */
    let choosingStation = false;
    /* Same guard as the slider's: a poll must not overwrite a flight number the
       user is halfway through typing. */
    let typingFlight = false;
    /* Set while the user is dragging, so a poll landing mid-drag cannot yank the
       slider out from under their thumb. */
    let dragging = false;
    async function refreshStatus() {
      const data = await fetch('/api/status').then(response => response.json());
      status.innerHTML = `Current mode: <strong>${data.current_mode}</strong>`;
      schedule.textContent = data.schedule_note || '';
      if (!dragging && typeof data.brightness === 'number') {
        slider.value = data.brightness;
        brightnessValue.textContent = `${data.brightness}%`;
      }
      if (!typingFlight && typeof data.flight === 'string' && data.flight !== flightInput.value) {
        flightInput.value = data.flight;
      }
      if (!choosingStation && typeof data.station === 'string' && data.station !== stationSelect.value) {
        stationSelect.value = data.station;
      }
      renderer.textContent = data.renderer_alive ? `Renderer online (PID ${data.renderer_pid})` : 'Renderer offline';
      renderer.className = `renderer ${data.renderer_alive ? 'online' : 'offline'}`;
      document.querySelectorAll('.mode-button').forEach(button => button.classList.toggle('active', button.dataset.mode === data.current_mode));
    }
    document.querySelectorAll('.mode-button').forEach(button => button.addEventListener('click', async () => {
      await fetch(`/mode/${button.dataset.mode}`, {method: 'POST'});
      refreshStatus();
    }));
    flightInput.addEventListener('input', () => {
      typingFlight = true;
      flightInput.value = flightInput.value.toUpperCase();
    });
    flightForm.addEventListener('submit', async event => {
      event.preventDefault();
      const response = await fetch('/flight', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({flight: flightInput.value})
      });
      const data = await response.json();
      typingFlight = false;
      flightNote.textContent = data.flight
        ? `Tracking ${data.flight}. It may take a few minutes to appear if it has not pushed back.`
        : 'Cleared. The panel will ask for a flight number.';
      refreshStatus();
    });
    stationSelect.addEventListener('change', () => { choosingStation = true; });
    stationForm.addEventListener('submit', async event => {
      event.preventDefault();
      const response = await fetch('/bart', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({station: stationSelect.value})
      });
      const data = await response.json();
      choosingStation = false;
      stationNote.textContent = data.error
        ? 'That station is not on the list.'
        : `Showing departures from ${data.station_name}.`;
      refreshStatus();
    });
    slider.addEventListener('input', () => {
      dragging = true;
      brightnessValue.textContent = `${slider.value}%`;
    });
    slider.addEventListener('change', async () => {
      await fetch('/brightness', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({brightness: slider.value})});
      dragging = false;
      refreshStatus();
    });
    refreshStatus();
    setInterval(refreshStatus, 10000);
  </script>
</body>
</html>
