[Journal]
# Cap systemd's journal at 200 MB on this device. Default is 10% of the
# root filesystem, which on an 8 GB SD card is ~740 MB — enough to matter
# on a device that logs ticker.service, ticker-web.service, and the
# fleet-updater timer continuously and unattended.
#
# 200 MB holds days-to-weeks of history for this workload; older entries
# are rotated out automatically. Live tail (`journalctl -f`) is unaffected.
#
# Installed to /etc/systemd/journald.conf.d/ticker.conf by install.sh.
SystemMaxUse=200M
