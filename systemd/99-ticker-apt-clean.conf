// apt keeps every .deb it downloads in /var/cache/apt/archives forever
// unless told otherwise. On a device that unattended-upgrades or
// scripts/update.sh touches every so often, kernel + firmware packages
// pile up and quietly eat SD card space. Run `apt-get clean` after
// every apt operation so the cache stays near-empty.
//
// Installed to /etc/apt/apt.conf.d/99-ticker-apt-clean by install.sh.
APT::Update::Post-Invoke {"apt-get clean";};
DPkg::Post-Invoke {"apt-get clean";};
